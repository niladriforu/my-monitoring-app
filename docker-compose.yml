services:
  api:
    build: ./backend
    environment:
      ENV: dev
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
  web:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_BASE: http://localhost:8000
    ports: ["5173:5173"]
