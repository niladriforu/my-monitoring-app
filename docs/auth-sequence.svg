<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1060" viewBox="0 0 1180 1060">
<rect width="1180" height="1060" fill="#f7f5f1"/>
<text x="32" y="36" font-family="Georgia, Palatino, serif" font-size="22" fill="#1c1915">Authenticate, then authorize one API method</text>
<text x="32" y="58" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c564c">The access token says who is calling. am-user and FastAPI each decide whether that caller may use this method.</text>
<defs>
  <marker id="req" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1c1915"/></marker>
  <marker id="ret" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6b645c"/></marker>
  <marker id="bad" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9a3412"/></marker>
  <marker id="ok" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6b45"/></marker>
</defs>
<line x1="80" y1="130" x2="80" y2="980" stroke="#d9d3c9" stroke-width="1.5" stroke-dasharray="2 6"/><line x1="270" y1="130" x2="270" y2="980" stroke="#d9d3c9" stroke-width="1.5" stroke-dasharray="2 6"/><line x1="480" y1="130" x2="480" y2="980" stroke="#d9d3c9" stroke-width="1.5" stroke-dasharray="2 6"/><line x1="700" y1="130" x2="700" y2="980" stroke="#d9d3c9" stroke-width="1.5" stroke-dasharray="2 6"/><line x1="910" y1="130" x2="910" y2="980" stroke="#d9d3c9" stroke-width="1.5" stroke-dasharray="2 6"/><line x1="1100" y1="130" x2="1100" y2="980" stroke="#d9d3c9" stroke-width="1.5" stroke-dasharray="2 6"/><rect x="12" y="74" width="136" height="48" fill="#1c1915"/><text x="80" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f7f5f1">Desk staff</text><text x="80" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c8c2b8">person</text><rect x="202" y="74" width="136" height="48" fill="#1c1915"/><text x="270" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f7f5f1">Cognito</text><text x="270" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c8c2b8">bank IdP + MFA</text><rect x="412" y="74" width="136" height="48" fill="#1c1915"/><text x="480" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f7f5f1">Command center</text><text x="480" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c8c2b8">SPA</text><rect x="632" y="74" width="136" height="48" fill="#1c1915"/><text x="700" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f7f5f1">API Gateway</text><text x="700" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c8c2b8">WAF in front</text><rect x="842" y="74" width="136" height="48" fill="#1c1915"/><text x="910" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f7f5f1">am-user</text><text x="910" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c8c2b8">authorizer</text><rect x="1032" y="74" width="136" height="48" fill="#1c1915"/><text x="1100" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f7f5f1">FastAPI</text><text x="1100" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c8c2b8">second check</text><text x="32" y="160" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em" fill="#8a8175">AUTHENTICATE</text><line x1="88" y1="188" x2="262" y2="188" stroke="#1c1915" stroke-width="1.7" marker-end="url(#req)"/><text x="175.0" y="181" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1c1915">Sign in at the bank IdP</text><line x1="262" y1="226" x2="88" y2="226" stroke="#6b645c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ret)"/><text x="175.0" y="219" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b645c">MFA challenge</text><line x1="88" y1="264" x2="262" y2="264" stroke="#1c1915" stroke-width="1.7" marker-end="url(#req)"/><text x="175.0" y="257" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1c1915">MFA response</text><line x1="278" y1="302" x2="472" y2="302" stroke="#1c1915" stroke-width="1.7" marker-end="url(#req)"/><text x="375.0" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1c1915">Authorization code</text><line x1="472" y1="340" x2="278" y2="340" stroke="#1c1915" stroke-width="1.7" marker-end="url(#req)"/><text x="375.0" y="333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1c1915">Code + PKCE verifier</text><line x1="278" y1="378" x2="472" y2="378" stroke="#6b645c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ret)"/><text x="375.0" y="371" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b645c">Access token, 15 min</text><rect x="32" y="398" width="1116" height="28" fill="#efeae2"/><text x="44" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c564c">Kept in memory. Scope am/read, plus am/write for analysts. Group is viewer, analyst, or admin. The API rejects an ID token.</text><text x="32" y="462" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em" fill="#8a8175">AUTHORIZE THIS METHOD</text><line x1="488" y1="490" x2="692" y2="490" stroke="#1c1915" stroke-width="1.7" marker-end="url(#req)"/><text x="590.0" y="483" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1c1915">Authorization: Bearer</text><line x1="708" y1="528" x2="902" y2="528" stroke="#1c1915" stroke-width="1.7" marker-end="url(#req)"/><text x="805.0" y="521" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1c1915">This method ARN</text><rect x="32" y="546" width="1116" height="28" fill="#efeae2"/><text x="44" y="564" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c564c">am-user checks: one Bearer token, RS256, this pool as issuer, token_use = access, AM client, lifetime at most 15 min, scope, group rank.</text><rect x="28" y="588" width="1124" height="76" fill="#fbf6ef" stroke="#9a3412"/><text x="40" y="606" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#9a3412">ALT    NO USABLE TOKEN</text><line x1="902" y1="640" x2="488" y2="640" stroke="#9a3412" stroke-width="1.7" marker-end="url(#bad)"/><text x="695.0" y="633" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a3412">401 unauthorized</text><rect x="28" y="676" width="1124" height="76" fill="#fbf3f1" stroke="#9a3412"/><text x="40" y="694" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#9a3412">ELSE    TOKEN IS GOOD, PERMISSION IS NOT</text><line x1="902" y1="728" x2="488" y2="728" stroke="#9a3412" stroke-width="1.7" marker-end="url(#bad)"/><text x="695.0" y="721" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a3412">403 Deny</text><rect x="28" y="764" width="1124" height="150" fill="#f2f7f3" stroke="#1f6b45"/><text x="40" y="782" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#1f6b45">ELSE    ALLOW THIS METHOD ONLY</text><line x1="902" y1="812" x2="708" y2="812" stroke="#1f6b45" stroke-width="1.7" marker-end="url(#ok)"/><text x="805.0" y="805" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f6b45">Allow</text><line x1="708" y1="850" x2="1092" y2="850" stroke="#1f6b45" stroke-width="1.7" marker-end="url(#ok)"/><text x="900.0" y="843" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f6b45">Proxy</text><line x1="1092" y1="888" x2="488" y2="888" stroke="#6b645c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ret)"/><text x="790.0" y="881" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b645c">200, or 401/403 if FastAPI rejects it</text><text x="32" y="990" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3a34">Reads need viewer and am/read. Writes need analyst and am/write. Admin passes both. No group passes nothing.</text><text x="32" y="1014" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3a34">A valid viewer token is still 403 on acknowledge or threshold edits. Allow names this method only. Ingest does not use this token.</text><text x="32" y="1042" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a8175">Solid arrow is a request. Dashed arrow is a reply.</text></svg>
